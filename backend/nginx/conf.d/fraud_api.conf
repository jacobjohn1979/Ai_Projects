upstream fraud_api {
    server api:8001;
    keepalive 32;
}

server {
    listen 80;
    server_name localhost;
    resolver 127.0.0.11 valid=10s;

    # ── Security headers ───────────────────────────────────────────────────────
    add_header X-Frame-Options        "DENY"            always;
    add_header X-Content-Type-Options "nosniff"         always;
    add_header X-XSS-Protection       "1; mode=block"   always;
    add_header Referrer-Policy        "no-referrer"     always;

    # ── Auth Service ───────────────────────────────────────────────────────────
    location /auth/ {
        proxy_pass          http://auth-service:8010/;
        proxy_set_header    Host            $host;
        proxy_set_header    X-Real-IP       $remote_addr;
        proxy_set_header    Cookie          $http_cookie;
        proxy_read_timeout  30s;
    }

    # ── Internal auth validation (used by auth_request) ───────────────────────
    location = /_auth_validate {
        internal;
        proxy_pass              http://auth-service:8010/validate?path=$request_uri;
        proxy_pass_request_body off;
        proxy_set_header        Content-Length "";
        proxy_set_header        X-Original-URI  $request_uri;
        proxy_set_header        Cookie          $http_cookie;
        proxy_set_header        Authorization   $http_authorization;
        proxy_read_timeout      10s;
    }

    # ── Named redirect locations ───────────────────────────────────────────────
    location @login_redirect {
        rewrite ^ /auth/login last;
    }
    location @forbidden {
        rewrite ^ /auth/login last;
    }

    # ── Root → fraud API ──────────────────────────────────────────────────────
    location = / {
        proxy_pass         http://fraud_api;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
    }

    # ── Screening endpoints ───────────────────────────────────────────────────
    location ~* ^/(screen-pdf|screen-image|screen-id-card) {
        limit_req zone=screen burst=5 nodelay;
        proxy_pass          http://fraud_api;
        proxy_set_header    Host            $host;
        proxy_set_header    X-Real-IP       $remote_addr;
        proxy_set_header    X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout  60s;
        proxy_send_timeout  60s;
        client_max_body_size 20M;
    }

    # ── Result polling ────────────────────────────────────────────────────────
    location ~* ^/result/ {
        limit_req zone=poll burst=20 nodelay;
        proxy_pass          http://fraud_api;
        proxy_set_header    Host            $host;
        proxy_set_header    X-Real-IP       $remote_addr;
        proxy_set_header    X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout  10s;
    }

    # ── Submission history ────────────────────────────────────────────────────
    location ~* ^/history/ {
        limit_req zone=poll burst=10 nodelay;
        proxy_pass          http://fraud_api;
        proxy_set_header    Host            $host;
        proxy_set_header    X-Real-IP       $remote_addr;
        proxy_set_header    X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # ── OpenAPI docs ──────────────────────────────────────────────────────────
    location ~* ^/(docs|redoc|openapi.json) {
        proxy_pass          http://fraud_api;
        proxy_set_header    Host            $host;
    }

    # ── Webhook dashboard ─────────────────────────────────────────────────────
    location /webhook-dashboard/ {
        limit_req zone=poll burst=10 nodelay;
        proxy_pass          http://webhook:8001/;
        proxy_set_header    Host            $host;
        proxy_set_header    X-Real-IP       $remote_addr;
        proxy_set_header    X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # ── Webhook receiver ──────────────────────────────────────────────────────
    location /webhook/ {
        proxy_pass          http://webhook:8001/webhook/;
        proxy_set_header    Host            $host;
        proxy_set_header    X-Real-IP       $remote_addr;
        proxy_set_header    X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # ── Analytics dashboard ───────────────────────────────────────────────────
    location /dashboard/ {
        limit_req zone=poll burst=10 nodelay;
        proxy_pass          http://dashboard:8002/;
        proxy_set_header    Host            $host;
        proxy_set_header    X-Real-IP       $remote_addr;
        proxy_set_header    X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # ── Applicant portal (no auth — public) ───────────────────────────────────
    location /apply/ {
        limit_req zone=poll burst=30 nodelay;
        proxy_pass          http://applicant-portal:8006/;
        proxy_set_header    Host            $host;
        proxy_set_header    X-Real-IP       $remote_addr;
        proxy_set_header    X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout  120s;
        client_max_body_size 50M;
    }

    # ── COHO Portal (auth required) ───────────────────────────────────────────
    location /coho/ {
        auth_request     /_auth_validate;
        error_page 401 = @login_redirect;
        error_page 403 = @login_redirect;
        proxy_pass          http://coho-portal:8008/;
        proxy_set_header    Host            $host;
        proxy_set_header    X-Real-IP       $remote_addr;
        client_max_body_size 35M;
        proxy_read_timeout  180s;
        proxy_buffering     off;
        proxy_cache         off;
    }

    # ── CBC Portal (auth required) ────────────────────────────────────────────
    location /cbc/ {
        auth_request     /_auth_validate;
        error_page 401 = @login_redirect;
        error_page 403 = @login_redirect;
        proxy_pass          http://cbc-portal:8007/;
        proxy_set_header    Host            $host;
        proxy_set_header    X-Real-IP       $remote_addr;
        client_max_body_size 25M;
        proxy_read_timeout  180s;
        proxy_buffering     off;
        proxy_cache         off;
    }

    # ── Bank Trainer (auth required) ──────────────────────────────────────────
    location /trainer/ {
        auth_request     /_auth_validate;
        error_page 401 = @login_redirect;
        error_page 403 = @login_redirect;
        proxy_pass          http://bank-trainer:8009/;
        proxy_set_header    Host            $host;
        proxy_set_header    X-Real-IP       $remote_addr;
        client_max_body_size 35M;
        proxy_read_timeout  60s;
        proxy_buffering     off;
    }

    # ── Staff Portal (auth required) ──────────────────────────────────────────
    location /portal/ {
        auth_request     /_auth_validate;
        error_page 401 = @login_redirect;
        error_page 403 = @login_redirect;
        limit_req zone=poll burst=20 nodelay;
        proxy_pass          http://portal:8003/;
        proxy_set_header    Host            $host;
        proxy_set_header    X-Real-IP       $remote_addr;
        proxy_set_header    X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout  300s;
        proxy_connect_timeout 60s;
        proxy_send_timeout  300s;
        client_max_body_size 50M;
    }

    # ── Loan Portal (auth required) ───────────────────────────────────────────
    location /loan/ {
        auth_request     /_auth_validate;
        error_page 401 = @login_redirect;
        error_page 403 = @login_redirect;
        limit_req zone=poll burst=20 nodelay;
        proxy_pass          http://loan-portal:8005/;
        proxy_set_header    Host            $host;
        proxy_set_header    X-Real-IP       $remote_addr;
        proxy_set_header    X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout  120s;
        client_max_body_size 50M;
    }

    # ── Loan API ──────────────────────────────────────────────────────────────
    location /api/v1/ {
        limit_req zone=screen burst=10 nodelay;
        proxy_pass          http://loan-api:8004/;
        proxy_set_header    Host            $host;
        proxy_set_header    X-Real-IP       $remote_addr;
        proxy_set_header    X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout  120s;
        client_max_body_size 50M;
    }

    location / {
        return 404;
    }
}
