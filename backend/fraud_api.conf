upstream fraud_api {
    server api:8001;
    keepalive 32;
}

server {
    listen 80;
    server_name localhost;

    add_header X-Frame-Options        "DENY"            always;
    add_header X-Content-Type-Options "nosniff"         always;
    add_header X-XSS-Protection       "1; mode=block"   always;
    add_header Referrer-Policy        "no-referrer"     always;

    location = / {
        proxy_pass         http://fraud_api;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
    }

    location ~* ^/(screen-pdf|screen-image|screen-id-card) {
        limit_req zone=screen burst=5 nodelay;
        proxy_pass          http://fraud_api;
        proxy_set_header    Host            $host;
        proxy_set_header    X-Real-IP       $remote_addr;
        proxy_set_header    X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout  60s;
        proxy_send_timeout  60s;
        client_max_body_size 20M;
    }

    location ~* ^/result/ {
        limit_req zone=poll burst=20 nodelay;
        proxy_pass          http://fraud_api;
        proxy_set_header    Host            $host;
        proxy_set_header    X-Real-IP       $remote_addr;
        proxy_set_header    X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout  10s;
    }

    location ~* ^/history/ {
        limit_req zone=poll burst=10 nodelay;
        proxy_pass          http://fraud_api;
        proxy_set_header    Host            $host;
        proxy_set_header    X-Real-IP       $remote_addr;
        proxy_set_header    X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location ~* ^/(docs|redoc|openapi.json) {
        proxy_pass          http://fraud_api;
        proxy_set_header    Host            $host;
    }

    location /webhook-dashboard/ {
        limit_req zone=poll burst=10 nodelay;
        proxy_pass          http://webhook:8001/;
        proxy_set_header    Host            $host;
        proxy_set_header    X-Real-IP       $remote_addr;
        proxy_set_header    X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /webhook/ {
        proxy_pass          http://webhook:8001/webhook/;
        proxy_set_header    Host            $host;
        proxy_set_header    X-Real-IP       $remote_addr;
        proxy_set_header    X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /dashboard/ {
        limit_req zone=poll burst=10 nodelay;
        proxy_pass          http://dashboard:8002/;
        proxy_set_header    Host            $host;
        proxy_set_header    X-Real-IP       $remote_addr;
        proxy_set_header    X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location / {
        return 404;
    }
}