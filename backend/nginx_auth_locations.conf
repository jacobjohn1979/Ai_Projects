    # ── Auth service ──────────────────────────────────────────────────────────
    location /auth/ {
        proxy_pass          http://auth-service:8010/;
        proxy_set_header    Host            $host;
        proxy_set_header    X-Real-IP       $remote_addr;
        proxy_set_header    X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout  30s;
    }

    # ── Internal auth validation endpoint ─────────────────────────────────────
    location = /_auth_validate {
        internal;
        proxy_pass              http://auth-service:8010/validate;
        proxy_pass_request_body off;
        proxy_set_header        Content-Length "";
        proxy_set_header        X-Original-URI  $request_uri;
        proxy_set_header        Cookie          $http_cookie;
        proxy_set_header        Authorization   $http_authorization;
        proxy_read_timeout      10s;
    }

    # ── COHO Portal (auth required) ────────────────────────────────────────────
    location /coho/ {
        auth_request         /_auth_validate;
        auth_request_set     $auth_status $upstream_status;
        error_page 401       = @login_redirect;
        error_page 403       = @forbidden;

        proxy_pass          http://coho-portal:8008/;
        proxy_set_header    Host            $host;
        proxy_set_header    X-Real-IP       $remote_addr;
        client_max_body_size 35M;
        proxy_read_timeout  180s;
        proxy_buffering     off;
        proxy_cache         off;
    }

    # ── CBC Portal (auth required) ─────────────────────────────────────────────
    location /cbc/ {
        auth_request         /_auth_validate;
        error_page 401       = @login_redirect;
        error_page 403       = @forbidden;

        proxy_pass          http://cbc-portal:8007/;
        proxy_set_header    Host            $host;
        proxy_set_header    X-Real-IP       $remote_addr;
        client_max_body_size 25M;
        proxy_read_timeout  180s;
        proxy_buffering     off;
        proxy_cache         off;
    }

    # ── Bank Trainer (auth required — admin only) ──────────────────────────────
    location /trainer/ {
        auth_request         /_auth_validate;
        error_page 401       = @login_redirect;
        error_page 403       = @forbidden;

        proxy_pass          http://bank-trainer:8009/;
        proxy_set_header    Host            $host;
        proxy_set_header    X-Real-IP       $remote_addr;
        client_max_body_size 35M;
        proxy_read_timeout  60s;
        proxy_buffering     off;
    }

    # ── Staff Portal (auth required) ───────────────────────────────────────────
    location /portal/ {
        auth_request         /_auth_validate;
        error_page 401       = @login_redirect;
        error_page 403       = @forbidden;

        limit_req zone=poll burst=20 nodelay;
        proxy_pass          http://portal:8003/;
        proxy_set_header    Host            $host;
        proxy_set_header    X-Real-IP       $remote_addr;
        proxy_read_timeout  300s;
        proxy_connect_timeout 60s;
        proxy_send_timeout  300s;
        client_max_body_size 50M;
    }

    # ── Loan Portal (auth required) ────────────────────────────────────────────
    location /loan/ {
        auth_request         /_auth_validate;
        error_page 401       = @login_redirect;
        error_page 403       = @forbidden;

        proxy_pass          http://loan-portal:8005/;
        proxy_set_header    Host            $host;
        proxy_set_header    X-Real-IP       $remote_addr;
        proxy_read_timeout  120s;
        client_max_body_size 20M;
    }

    # ── Login redirect handler ─────────────────────────────────────────────────
    location @login_redirect {
        return 302 /auth/login?redirect=$request_uri;
    }

    location @forbidden {
        return 302 /auth/login?redirect=$request_uri;
    }
